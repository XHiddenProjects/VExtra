# Publishes the live demo (Vextra Studio running in the browser) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# The demo is the same app as the desktop version, without the desktop-only parts (local files, the bundled server).
name: demo-site

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci runs the "postinstall" step (scripts/vendor.js) that builds renderer/vendor.
      - run: npm ci

      - name: build the static site
        run: node scripts/build-web.js --out dist-web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
