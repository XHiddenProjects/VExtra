# Builds the desktop installers (Linux, macOS, Windows) and attaches them to a GitHub Release.
#   • Publish a release          → every installer is built and uploaded to that release automatically.
#   • Run it by hand (Actions tab) → give the numeric Release ID (gh api repos/OWNER/REPO/releases --jq '.[].id').
# Needs no secrets: GITHUB_TOKEN is enough. The installers are NOT code-signed (see SECURITY.md).
name: release-build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_id:
        description: 'GitHub Release ID to attach assets to (a number, not the tag name)'
        required: true
        type: string

concurrency:
  group: release-build-${{ github.event.release.id || inputs.release_id }}
  cancel-in-progress: false

jobs:
  # Finds the release's tag, so a manual run builds the code that was released (not whatever the default branch is today).
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.r.outputs.release_id }}
      tag: ${{ steps.r.outputs.tag }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id || inputs.release_id }}
        run: |
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then echo "::error::Release ID must be a number (got '$RELEASE_ID')"; exit 1; fi
          TAG=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" --jq .tag_name)
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (release $RELEASE_ID)"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # All runners use the newest image. (An AppImage built on a newer Ubuntu needs a newer glibc on the player's PC;
          # if you want it to run on older distributions, pin this one entry to an older image such as ubuntu-24.04.)
          - name: linux
            runner: ubuntu-latest
            args: "--bundles deb,appimage"
          # The bundled server is compiled for the machine that builds it, so each Mac CPU gets its own build.
          - name: macos-apple-silicon
            runner: macos-latest
            args: "--bundles app,dmg"
          - name: macos-intel
            runner: macos-26-intel
            args: "--bundles app,dmg"
          - name: windows
            runner: windows-latest
            args: "--bundles msi,nsis"

    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*   # always the current Node.js LTS
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file patchelf libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # npm ci also runs the "postinstall" step (scripts/vendor.js) that builds renderer/vendor (3D engine, glTF/Draco, editor, sql.js).
      - name: install frontend dependencies
        run: npm ci

      # Compiles the local server into one executable for THIS operating system (the script does not need a --target flag).
      - name: build server
        run: node scripts/build-server.js

      # Signed auto-updater. It is switched on only when BOTH exist: the private key as the secret TAURI_SIGNING_PRIVATE_KEY and the
      # public key in src-tauri/updater/pubkey.txt (made once by `npm run updater:keygen`). Without them the installers are built as
      # before and the log says so – and the action is told not to look for updater signatures ("Signature not found for the updater JSON").
      - name: prepare the signed updater
        id: upd
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          PUB=$(tr -d '[:space:]' < src-tauri/updater/pubkey.txt)
          if [ -n "$SIGNING_KEY" ] && [ "${#PUB}" -gt 40 ] && [[ "$PUB" != NOT-SET* ]]; then
            node -e "const fs=require('fs');const k=fs.readFileSync('src-tauri/updater/pubkey.txt','utf8').trim();fs.writeFileSync('src-tauri/updater/enable.conf.json',JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:k}}}))"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signed updater: ON"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Auto-updater is off::Add the repository secret TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and commit src-tauri/updater/pubkey.txt – run 'npm run updater:keygen' once. The installers are still built."
          fi

      # Updater files (latest.json + signatures) are only uploaded when the updater is on.
      - name: build & upload to the release
        id: tauri
        # Windows: the MSI carries an extra "delete my app data" fragment (src-tauri/windows/fragments/data-removal.wxs).
        # If that fragment ever breaks the MSI build, the next step builds Windows again without it, so a release is never blocked.
        continue-on-error: ${{ matrix.name == 'windows' }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}${{ steps.upd.outputs.enabled == 'true' && ' --config src-tauri/updater/enable.conf.json' || '' }}
          uploadUpdaterJson: ${{ steps.upd.outputs.enabled == 'true' }}
          uploadUpdaterSignatures: ${{ steps.upd.outputs.enabled == 'true' }}

      - name: build Windows again without the MSI data-removal fragment
        if: matrix.name == 'windows' && steps.tauri.outcome == 'failure'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }} --config src-tauri/windows/no-wix-fragment.conf.json${{ steps.upd.outputs.enabled == 'true' && ' --config src-tauri/updater/enable.conf.json' || '' }}
          uploadUpdaterJson: ${{ steps.upd.outputs.enabled == 'true' }}
          uploadUpdaterSignatures: ${{ steps.upd.outputs.enabled == 'true' }}

      - name: tell me if the fallback was used
        if: matrix.name == 'windows' && steps.tauri.outcome == 'failure'
        run: echo "::warning title=MSI without data removal::The Windows build failed with the MSI data-removal fragment and was rebuilt without it. Check the log of the first build step."

  # One file with the SHA-256 of every installer, so people can check their download.
  checksums:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.msi' --pattern '*.exe' --pattern '*.dmg' --pattern '*.deb' --pattern '*.AppImage' || true
          if ls * >/dev/null 2>&1; then
            sha256sum * > ../SHA256SUMS.txt && cat ../SHA256SUMS.txt
            gh release upload "$TAG" ../SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
          else
            echo "No installers found on the release – nothing to hash."
          fi

      # The four build jobs each add their platform to latest.json. If two finish at the same moment one entry can get lost,
      # so check that every platform is there and say so if not (re-running the failed build job adds the missing entry).
      - name: check latest.json (auto-updater)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p upd && cd upd
          if ! gh release download "$TAG" --repo "${{ github.repository }}" --pattern latest.json; then
            echo "No latest.json on this release – the auto-updater was off for this build."; exit 0
          fi
          node -e "
            const j = JSON.parse(require('fs').readFileSync('latest.json','utf8')), have = Object.keys(j.platforms || {});
            const need = ['linux-x86_64', 'darwin-aarch64', 'darwin-x86_64', 'windows-x86_64'];
            const missing = need.filter((n) => !have.some((h) => h === n || h.startsWith(n + '-')));
            console.log('version', j.version, '| platforms:', have.join(', '));
            if (missing.length) { console.log('::warning title=latest.json is missing platforms::' + missing.join(', ') + ' – re-run the build job of that platform (Actions → this run → Re-run job).'); }
          "
